[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-its-resilience-ai"
version = "0.2.0"
description = "AI-Assisted Resilience Framework for SDN-Enabled Intelligent Transportation Systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trinh Hoang Tu" }]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "Flask>=2.3.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "scapy>=2.5.0",
    "traci>=1.18.0",
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0", "huggingface_hub>=0.20.0"]
export = ["onnx>=1.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pragmatic research-repo ruleset (CI-friendly)
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "W",   # pycodestyle warnings
]
ignore = [
  "E501",  # line length handled by formatter preference
  "E402",  # path-bootstrap before imports in legacy CLI modules
  "E741",  # short names like n, l, f for tensor shapes
  "B006",  # mutable defaults used intentionally in a few helpers
  "B008",  # function calls in defaults (Flask patterns)
  "UP007", # Optional[X] still fine alongside X | None
]


[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # bootstrap path hacks before imports
"tests/*" = ["E402"]
"benchmark/*" = ["E402"]

