# Camera selection for the research console (no secrets / no site names here).
# Inventory JSON (gitignored) holds RTSP URLs. Do NOT commit real camera IDs or place names.
#
# Prefer:
#   select_mode: first_n     → take first max_cameras entries that have a stream URL
# Optional override (gitignored):
#   configs/cameras.local.yaml  with explicit select: [{id: ...}, ...]

enabled: true
inventory: 1.cameras.json

# first_n | explicit
# - first_n: no hardcoded inventory UUIDs in this repo file
# - explicit: requires select: below OR configs/cameras.local.yaml
select_mode: first_n
select: []

# Bound resource use
max_cameras: 3
probe_interval_s: 5
sample_frames: true
frame_dir: tmp/camera_frames
frame_max_bytes: 2500000
rtsp_transport: tcp
ffprobe_timeout_s: 10
ffmpeg_timeout_s: 18
probe_primary_first: true

# Display: always cam1..camN (never inventory place names in the console)
anonymize_labels: true

physical_mode: rtsp_detector

detector:
  enabled: true
  weights: models/detectors/yolov8n.pt
  device: auto
  conf: 0.35
  iou: 0.45
  imgsz: 640
  annotate_preview: true
  max_det: 100
  zone_y0: 0.35
  meters_per_norm_height: 45.0
