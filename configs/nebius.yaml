# Nebius Token Factory — hackathon Nemotron integration
# Set NEBIUS_API_KEY in the environment (never commit secrets).

base_url: "https://api.tokenfactory.nebius.com/v1"
# Public catalog ID (eu-north1 Lightning)
model: "nvidia/Nemotron-3_5-Lightning"
timeout_s: 60
temperature: 0.2
max_tokens: 512
# Demo keeps containment intentions blocked even if the model suggests drop/rate_limit
demo_mode: true
allow_containment_in_demo: false
# Rough list prices used only for local cost estimates (USD / 1M tokens)
pricing:
  input_per_million: 0.06
  output_per_million: 0.24
