name: benchmark

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run latency benchmark
        run: |
          mkdir -p results
          python -c "from benchmark.latency import run; import json; open('results/latency.json','w').write(json.dumps(run(), indent=2))"
          python -c "from benchmark.cpu import run; import json; open('results/cpu.json','w').write(json.dumps(run(), indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
