# Research console + optional telemetry feeder.
#
#   cd docker
#   docker compose up --build
#   → http://127.0.0.1:8080/
#
# With cameras (host must have ../1.cameras.json):
#   docker compose -f docker-compose.yml -f docker-compose.cameras.yml up --build
#
# See docs/docker.md

services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SDN_CAMERAS_CONFIG: /app/configs/cameras.yaml
    volumes:
      - ../models:/app/models
      - ../configs:/app/configs
      - ../artifacts:/app/artifacts
      - ../tmp/camera_frames:/app/tmp/camera_frames
    command: ["python", "-m", "api.app", "--port", "8080"]

  telemetry:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - controller
    volumes:
      - ../models:/app/models
      - ../configs:/app/configs
    command:
      [
        "python",
        "-m",
        "sdn_its.simulation.traffic_generator",
        "--controller",
        "http://controller:8080",
        "--interval",
        "1.5",
      ]
