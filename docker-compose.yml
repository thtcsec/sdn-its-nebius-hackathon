# Run from repo root:
#   docker compose up -d --build
#   → http://127.0.0.1:8080/
#
# With cameras (requires ./1.cameras.json on host):
#   docker compose -f docker-compose.yml -f docker/docker-compose.cameras.yml up -d --build
#
# See docs/docker.md

services:
  controller:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      # Host loopback only — avoid exposing the research console on all interfaces.
      - "127.0.0.1:8080:8080"
    environment:
      SDN_CAMERAS_CONFIG: /app/configs/cameras.yaml
      SDN_BIND_HOST: "0.0.0.0"
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
      - ./artifacts:/app/artifacts
      - ./tmp/camera_frames:/app/tmp/camera_frames
    command: ["python", "-m", "api.app", "--host", "0.0.0.0", "--port", "8080"]

  telemetry:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - controller
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
    command:
      [
        "python",
        "-m",
        "sdn_its.simulation.traffic_generator",
        "--controller",
        "http://controller:8080",
        "--interval",
        "1.5",
      ]
